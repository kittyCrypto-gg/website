name: Validate

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches: [main, "feat/buildtime-static-shells"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          path: candidate

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install candidate dependencies
        run: npm ci
        working-directory: candidate

      - name: Validate candidate
        run: npm run validate
        working-directory: candidate

      - name: Upload esbuild architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esbuild-architecture
          path: |
            candidate/.build/esbuild-meta.json
            candidate/.build/esbuild-analysis.txt
            candidate/src
          if-no-files-found: error
